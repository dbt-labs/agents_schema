name: Agents Schema Skills

on:
  workflow_call:
    inputs:
      skills-dir:
        description: 'Path to a directory containing markdown skill files'
        type: string
        required: true
      provider:
        description: 'Publisher name to use for AGENTS.ROOT skill rows'
        type: string
        required: false
        default: 'user'
      workload-identity-provider:
        description: >
          Workload Identity Federation provider resource name for keyless BigQuery auth
          (WAREHOUSE_CREDENTIALS.auth_method: adc). Requires service-account too. Leave
          unset to authenticate with WAREHOUSE_CREDENTIALS alone.
        type: string
        required: false
        default: ''
      service-account:
        description: 'Google service account email to impersonate via Workload Identity Federation'
        type: string
        required: false
        default: ''
    secrets:
      WAREHOUSE_CREDENTIALS:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Agents Schema runtime
        uses: $/.github/actions/agents-schema-runtime
        with:
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: inputs.workload-identity-provider != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Run skills ingestion
        uses: $/.github/actions/agents-schema-skills
        with:
          skills-dir: ${{ inputs.skills-dir }}
          provider: ${{ inputs.provider }}
        env:
          WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
