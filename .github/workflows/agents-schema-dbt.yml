name: Agents Schema dbt

on:
  workflow_call:
    inputs:
      dbt-project-dir:
        description: 'Path to the dbt project containing target/manifest.json'
        type: string
        required: true
      dbt-profile-name:
        description: 'dbt profile name to use for managed dbt parse when target/manifest.json is missing'
        type: string
        required: false
        default: ''
      dbt-target:
        description: 'Optional dbt target to use for managed dbt parse'
        type: string
        required: false
        default: ''
      dbt-parse-command:
        description: 'Optional custom command to create target/manifest.json when it is missing'
        type: string
        required: false
        default: ''
      workload-identity-provider:
        description: >
          Workload Identity Federation provider resource name for keyless BigQuery auth
          (WAREHOUSE_CREDENTIALS.auth_method: adc). Requires service-account too. Leave
          unset to authenticate with WAREHOUSE_CREDENTIALS alone.
        type: string
        required: false
        default: ''
      service-account:
        description: 'Google service account email to impersonate via Workload Identity Federation'
        type: string
        required: false
        default: ''
    secrets:
      WAREHOUSE_CREDENTIALS:
        required: true
      DBT_PROFILES_YML:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Agents Schema runtime
        uses: $/.github/actions/agents-schema-runtime
        with:
          workflow-ref: ${{ job.workflow_ref }}
          workflow-sha: ${{ job.workflow_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: inputs.workload-identity-provider != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Run dbt ingestion
        uses: $/.github/actions/agents-schema-dbt
        with:
          dbt-project-dir: ${{ inputs.dbt-project-dir }}
          dbt-profile-name: ${{ inputs.dbt-profile-name }}
          dbt-target: ${{ inputs.dbt-target }}
          dbt-parse-command: ${{ inputs.dbt-parse-command }}
        env:
          WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
