name: 'Agents Schema Skills'
description: >
  Ingests markdown skills into AGENTS.ROOT and parsed uses into AGENTS.SKILL_USE.

inputs:
  skills-dir:
    description: 'Path to a directory containing markdown skill files'
    required: true
  provider:
    description: 'Publisher name to use for AGENTS.ROOT skill rows'
    required: false
    default: 'user'
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Run skills ingestion
      shell: bash
      env:
        UV_PYTHON: '3.12'
        AGENTS_SCHEMA_SKILLS_DIR: ${{ inputs.skills-dir }}
        AGENTS_SCHEMA_SKILLS_PROVIDER: ${{ inputs.provider }}
      run: |
        uvx --from "$GITHUB_ACTION_PATH/../../.." \
          agents-schema skills \
            --skills-dir "$AGENTS_SCHEMA_SKILLS_DIR" \
            --provider "$AGENTS_SCHEMA_SKILLS_PROVIDER"
